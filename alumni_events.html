<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlumniConnect - Events & RSVPs</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            display: flex;
            width: 100%;
            min-height: 100vh;
            background: #f4f7fb;
            color: #202b3c;
            overflow-x: hidden;
        }

        .side-bar{
            background-color: #142b4a;
            width: 240px;
            min-width: 240px;
            max-width: 240px;
            flex-shrink: 0;
            min-height: 100vh;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .container1{
            padding: 25px 20px 15px 20px;
        }

        .txt1{
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        
        .container2{
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .container2 a{
            display: block;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 7px;
            color: #d5e1ef;
            font-size: 14px;
            transition: 0.2s;
        }

        .container2 a:hover, .container2 a.active{
            background: #194879;
            color: white;
        }

        .profile {
            margin-top: auto;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-left: 15px;
            margin-right: 15px;
        }

        .profile-info h4 {
            font-size: 14px;
            color: white;
        }

        .profile-info p {
            color: #aabbd0;
            font-size: 12px;
            margin-top: 3px;
        }

        .main{
            flex: 1;
            min-width: 0;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .nav-bar{
            height: 68px;
            background: white;
            border-bottom: 1px solid #e5edf5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .search-box{
            width: 55%;
            max-width: 50vw;
        }

        .search{
            width: 100%;
            padding: 10px 15px;
            background-color: #f1f6fb;
            border: 1px solid #e2eaf2;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .search:focus{
            border-color: #194879;
            background: white;
        }

        .top-icons{
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .notification{
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            color: #4a5d78;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #dcecff;
            color: #12365c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .dashboard{
            padding: 25px 30px;
        }

        .heading1 {
            color: #102944;
            font-size: 24px;
            margin-bottom: 6px;
        }

        .sub-heading {
            color: #71839a;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .event-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5edf5;
            margin-bottom: 20px;
        }

        .event-tabs {
            display: flex;
            gap: 25px;
        }

        .event-tabs button {
            border: none;
            background: none;
            padding: 12px 18px;
            font-size: 14px;
            color: #7c8da3;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -1px;
            font-weight: 600;
            transition: 0.2s;
        }

        .event-tabs button.active {
            color: #142b4a;
            border-bottom-color: #194879;
            font-weight: 700;
        }

        .inst-managed-tag {
            font-size: 12px;
            color: #194879;
            background: #eef5fc;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* Event list & cards */
        .events-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .event-card{
            background: white;
            border: 1px solid #eaf0f6;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 22px;
            box-shadow: 0 3px 12px rgba(20, 50, 80, 0.04);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .event-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(20, 50, 80, 0.08);
        }

        .event-image{
            width: 160px;
            height: 120px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .event-details{
            flex: 1;
        }

        .event-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            background: #eef5fc;
            color: #194879;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .event-details h3{
            color: #122d4a;
            font-size: 18px;
            margin-bottom: 6px;
        }

        .event-meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #556987;
            margin-bottom: 8px;
        }

        .event-details p.description {
            color: #71839a;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .event-attendees {
            font-size: 12px;
            color: #194879;
            font-weight: 600;
        }

        .evt-btn{
            background: #0b315b;
            border: none;
            border-radius: 6px;
            padding: 11px 22px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .evt-btn:hover{
            background: #174d82;
        }

        .evt-btn.registered {
            background: #10b981;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            background: white;
            border-radius: 10px;
            border: 1px dashed #cbd5e1;
            color: #71839a;
        }
    </style>
</head>
<body>
    
    <div class="side-bar">

        <div>
            <div class="container1">
                <span class="txt1">AlumniConnect</span>
            </div>

            <div class="container2">
                <a href="alumni_home.html">Dashboard</a>
                <a href="alumni_events.html" class="active">Events & RSVPs</a>
                <a href="alumni_mentorship.html">Mentees & Requests</a>
                <a href="alumni_announcements.html">Announcements</a>
                <a href="alumni_messages.html">Institute Helpdesk</a>
                <a href="alumni_profile.html">My Profile</a>
                <a href="login.html" onclick="localStorage.removeItem('currentUser')">Sign Out</a>
            </div>
        </div>

        <div class="profile" onclick="window.location.href='alumni_profile.html'" style="cursor: pointer;">
            <div class="avatar" id="userAvatar">RS</div>
            <div class="profile-info">
                <h4 id="sidebarName">Rahul Sharma</h4>
                <p id="sidebarRole">Alumni</p>
            </div>
        </div>

    </div>

    <main class="main">

        <header class="nav-bar">
            
            <div class="search-box">
                <input type="search" class="search" placeholder="Search events by title, venue...">
            </div>

            <div class="top-icons">
                <span class="notification" title="Announcements" onclick="window.location.href='alumni_announcements.html'">📢</span>
                <span class="notification" title="Messages" onclick="window.location.href='alumni_messages.html'">💬</span>
                <div class="avatar" id="topAvatar" onclick="window.location.href='alumni_profile.html'">RS</div>
            </div>

        </header>

        <section class="dashboard">

            <h2 class="heading1">Events & Reunions</h2>
            <p class="sub-heading">Browse scheduled reunions, webinars, and manage your RSVP attendance.</p>

            <div class="event-actions">
                <div class="event-tabs">
                    <button class="active" id="tabUpcoming" onclick="switchTab('upcoming')">
                        Upcoming Events
                    </button>
                    <button id="tabPast" onclick="switchTab('past')">
                        Past Events
                    </button>
                    <button id="tabRsvpd" onclick="switchTab('rsvpd')">
                        My RSVPs
                    </button>
                </div>

                <span class="inst-managed-tag">🏛 Events Organized by Alumni Office</span>
            </div>

            <!-- EVENTS LIST CONTAINER -->
            <div class="events-container" id="eventsList">
                <!-- Dynamically populated by JS -->
            </div>

        </section>

    </main>

    <script src="shared.js"></script>
    <script>
        let currentTab = 'upcoming';

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById("tabUpcoming").classList.toggle("active", tab === 'upcoming');
            document.getElementById("tabPast").classList.toggle("active", tab === 'past');
            document.getElementById("tabRsvpd").classList.toggle("active", tab === 'rsvpd');
            renderEvents();
        }

        function renderEvents() {
            const listEl = document.getElementById("eventsList");
            const events = JSON.parse(localStorage.getItem("alumni_events")) || [];

            let filtered = [];
            if (currentTab === 'upcoming') {
                filtered = events.filter(e => e.status === 'upcoming');
            } else if (currentTab === 'past') {
                filtered = events.filter(e => e.status === 'past');
            } else if (currentTab === 'rsvpd') {
                filtered = events.filter(e => e.userRsvp === true);
            }

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <h3>No events found in this category</h3>
                        <p style="margin-top: 8px;">Check other tabs to explore institutional gatherings.</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = filtered.map(evt => `
                <div class="event-card">
                    <img class="event-image" src="${evt.image}" alt="${evt.title}">
                    <div class="event-details">
                        <span class="event-tag">${evt.category}</span>
                        <h3>${evt.title}</h3>
                        <div class="event-meta">
                            <span>📅 ${evt.date} · ${evt.time}</span>
                            <span>📍 ${evt.venue}</span>
                        </div>
                        <p class="description">${evt.description}</p>
                        <span class="event-attendees">👥 ${evt.rsvps} Alumni & Students Attending</span>
                    </div>
                    <div>
                        <button class="evt-btn ${evt.userRsvp ? 'registered' : ''}" onclick="toggleRsvp(${evt.id})">
                            ${evt.userRsvp ? 'RSVP Confirmed ✓' : 'Register RSVP'}
                        </button>
                    </div>
                </div>
            `).join("");
        }

        function toggleRsvp(eventId) {
            let events = JSON.parse(localStorage.getItem("alumni_events")) || [];
            events = events.map(evt => {
                if (evt.id === eventId) {
                    evt.userRsvp = !evt.userRsvp;
                    evt.rsvps += evt.userRsvp ? 1 : -1;
                }
                return evt;
            });
            localStorage.setItem("alumni_events", JSON.stringify(events));
            renderEvents();
        }

        document.addEventListener("DOMContentLoaded", renderEvents);
    </script>
</body>
</html>
